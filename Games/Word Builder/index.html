<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Word Builder</title>
    <link rel="stylesheet" href="../../app-nav.css">
    <link rel="stylesheet" href="word-builder.css">
    <script src="../../app-nav.js" defer></script>
  </head>
  <body data-app-surface="game">
    <main class="builder-app" aria-label="Word Builder game">
      <header class="topbar">
        <a class="icon-link" href="../index.html" aria-label="Back to Game Quest">‹</a>
        <div class="player-chip">
          <span id="playerInitials">--</span>
          <div>
            <p>Now building</p>
            <strong id="playerName">Player</strong>
          </div>
        </div>
        <div class="score-chip">
          <p>Total</p>
          <strong id="totalPoints">0</strong>
        </div>
      </header>

      <section class="arena" aria-label="Current word">
        <div class="round-hud">
          <div>
            <p class="mini-label" id="roundLevel">Wilson 1.3</p>
            <h1 id="prompt">Build the word.</h1>
          </div>
          <div class="timer-shell" aria-label="Time left">
            <span id="timerFill"></span>
          </div>
        </div>

        <div class="word-card" aria-label="Target word">
          <span id="targetWord">cat</span>
        </div>

        <div class="build-stage" id="buildStage">
          <div class="slot-row" id="slotRow" aria-label="Build slots"></div>
          <div class="tile-bank" id="tileBank" aria-label="Sound tiles"></div>
        </div>

        <div class="mark-panel hidden" id="markPanel" aria-label="Mark the word">
          <p class="mini-label" id="markPrompt">Mark the short vowel.</p>
          <div class="mark-word" id="markWord"></div>
          <div class="mark-actions">
            <button class="ghost-btn" id="scoopBtn" type="button">Scoop</button>
            <button class="primary-btn" id="closedBtn" type="button">Closed</button>
          </div>
        </div>

        <div class="action-row">
          <button class="ghost-btn" id="clearBtn" type="button">Clear</button>
          <button class="primary-btn" id="checkBtn" type="button">Build</button>
          <button class="ghost-btn hidden" id="nextBtn" type="button">Next word</button>
        </div>
      </section>

      <section class="stat-strip" aria-label="Game stats">
        <article>
          <strong id="streakCount">0</strong>
          <span>Streak</span>
        </article>
        <article>
          <strong id="roundPoints">+0</strong>
          <span>Last round</span>
        </article>
        <article>
          <strong id="nextBonus">4</strong>
          <span>Boss in</span>
        </article>
      </section>

      <section class="milestone-road" aria-label="Milestone progress">
        <div class="road-fill" id="roadFill"></div>
        <div class="road-dots" id="roadDots"></div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="word-builder.js"></script>
  </body>
</html>
