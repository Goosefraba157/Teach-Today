    <style>
      :root {
        color-scheme: light;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #dbe7ef;
        --teal: #0f766e;
        --bg: #eef7f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .prep-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .prep-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, .94);
        backdrop-filter: blur(12px);
      }

      .prep-brand {
        display: grid;
        gap: 2px;
      }

      .prep-brand span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 950;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .prep-brand strong {
        color: var(--ink);
        font-size: 22px;
        font-weight: 950;
      }

      .prep-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .prep-actions a,
      .prep-actions button {
        min-height: 36px;
        border: 1px solid #99f6e4;
        border-radius: 999px;
        padding: 8px 13px;
        background: #fff;
        color: var(--teal);
        font: inherit;
        font-size: 13px;
        font-weight: 950;
        text-decoration: none;
        cursor: pointer;
      }

      .prep-layout {
        display: grid;
        grid-template-columns: minmax(230px, 320px) minmax(0, 1fr);
        gap: 16px;
        width: min(1240px, 100%);
        margin: 0 auto;
        padding: 16px;
      }

      .prep-list,
      .prep-detail {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 18px 45px rgba(15, 23, 42, .08);
      }

      .prep-list {
        align-self: start;
        position: sticky;
        top: 76px;
        max-height: calc(100vh - 92px);
        overflow: auto;
        padding: 10px;
      }

      .prep-list h2 {
        margin: 4px 6px 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 950;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .prep-list button {
        width: 100%;
        display: grid;
        gap: 2px;
        margin: 0 0 6px;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px;
        background: #f8fafc;
        color: var(--ink);
        text-align: left;
        font: inherit;
        cursor: pointer;
      }

      .prep-list button.active {
        border-color: #14b8a6;
        background: #ccfbf1;
      }

      .prep-list strong {
        font-size: 14px;
        font-weight: 950;
      }

      .prep-list span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .prep-detail {
        display: grid;
        gap: 16px;
        padding: 18px;
      }

      .prep-detail header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
      }

      .prep-detail h1 {
        margin: 0;
        font-size: clamp(25px, 3vw, 38px);
        line-height: 1;
      }

      .prep-meta {
        margin: 8px 0 0;
        color: var(--muted);
        font-weight: 850;
      }

      .prep-status {
        align-self: start;
        border-radius: 999px;
        padding: 6px 10px;
        background: #e0f2fe;
        color: #075985;
        font-size: 12px;
        font-weight: 950;
        white-space: nowrap;
      }

      .prep-section {
        display: grid;
        gap: 10px;
      }

      .prep-section h2 {
        margin: 0;
        font-size: 16px;
      }

      .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 10px;
      }

      .vocab-card,
      .question-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #f8fafc;
      }

      .vocab-card {
        display: grid;
        gap: 4px;
      }

      .vocab-card strong {
        color: var(--teal);
        font-size: 18px;
      }

      .vocab-card span {
        font-weight: 850;
      }

      .vocab-card small {
        color: var(--muted);
        line-height: 1.35;
      }

      .question-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .question-card h3 {
        margin: 0 0 8px;
      }

      .question-card ol {
        margin: 0;
        padding-left: 22px;
      }

      .question-card li {
        padding: 5px 0;
        line-height: 1.4;
      }

      .copy-note {
        min-height: 20px;
        color: var(--teal);
        font-size: 13px;
        font-weight: 850;
      }

      @media (max-width: 820px) {
        .prep-layout,
        .question-grid {
          grid-template-columns: minmax(0, 1fr);
        }

        .prep-list {
          position: static;
          max-height: 260px;
        }

        .prep-detail header,
        .prep-bar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>

      let selectedId = new URLSearchParams(location.search).get("passage") || PASSAGES[0].id;

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (match) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;"
        }[match]));
      }

      function companionFor(id) {
        return window.section9PassageCompanions?.[id] || {};
      }

      function renderList() {
        document.getElementById("passageList").innerHTML = PASSAGES.map((passage) => `
          <button type="button" class="${passage.id === selectedId ? "active" : ""}" data-passage-id="${escapeHtml(passage.id)}">
            <strong>${escapeHtml(passage.title)}</strong>
            <span>${escapeHtml(passage.substep)} ${escapeHtml(passage.level)} - Reader ${escapeHtml(passage.reader || 1)}, ${escapeHtml(passage.pages)}</span>
          </button>
        `).join("");
        document.querySelectorAll("[data-passage-id]").forEach((button) => {
          button.addEventListener("click", () => {
            selectedId = button.dataset.passageId;
            history.replaceState(null, "", `Section9PassagePrep.html?passage=${encodeURIComponent(selectedId)}`);
            render();
          });
        });
      }

      function renderDetail() {
        const passage = PASSAGES.find((item) => item.id === selectedId) || PASSAGES[0];
        const companion = companionFor(passage.id);
        const vocab = companion.vocabulary || [];
        const support = companion.questions?.support || [];
        const stretch = companion.questions?.stretch || [];
        document.getElementById("prepDetail").innerHTML = `
          <header>
            <div>
              <h1>${escapeHtml(passage.title)}</h1>
              <p class="prep-meta">Reader ${escapeHtml(passage.reader || 1)} - ${escapeHtml(passage.substep)} ${escapeHtml(passage.level)} - ${escapeHtml(passage.pages)}</p>
            </div>
            <span class="prep-status">${escapeHtml(companion.status || "not drafted")}</span>
          </header>
          <section class="prep-section">
            <h2>Pre-teach Vocabulary</h2>
            <div class="vocab-grid">
              ${vocab.map((item) => `
                <article class="vocab-card">
                  <strong>${escapeHtml(item.word)}</strong>
                  <span>${escapeHtml(item.meaning)}</span>
                  <small>${escapeHtml(item.whyPreteach || "")}</small>
                  <small>${escapeHtml(item.prompt || "")}</small>
                </article>
              `).join("") || "<p>No vocabulary drafted yet.</p>"}
            </div>
          </section>
          <section class="prep-section question-grid">
            <article class="question-card">
              <h3>Support Questions</h3>
              <ol>${support.map((item) => `<li>${escapeHtml(item.question || item)}</li>`).join("") || "<li>No support questions drafted yet.</li>"}</ol>
            </article>
            <article class="question-card">
              <h3>Stretch Questions</h3>
              <ol>${stretch.map((item) => `<li>${escapeHtml(item.question || item)}</li>`).join("") || "<li>No stretch questions drafted yet.</li>"}</ol>
            </article>
          </section>
          <p id="copyNote" class="copy-note"></p>
        `;
      }

      function selectedPrepText() {
        const passage = PASSAGES.find((item) => item.id === selectedId) || PASSAGES[0];
        const companion = companionFor(passage.id);
        const vocab = (companion.vocabulary || []).map((item) => `- ${item.word}: ${item.meaning}`);
        const support = (companion.questions?.support || []).map((item, index) => `${index + 1}. ${item.question || item}`);
        const stretch = (companion.questions?.stretch || []).map((item, index) => `${index + 1}. ${item.question || item}`);
        return [
          `${passage.title} - Reader ${passage.reader || 1}, ${passage.substep} ${passage.level}, ${passage.pages}`,
          "",
          "Pre-teach vocabulary:",
          ...vocab,
          "",
          "Support questions:",
          ...support,
          "",
          "Stretch questions:",
          ...stretch
        ].join("\n");
      }

      function render() {
        renderList();
        renderDetail();
      }

      document.getElementById("copyPrep").addEventListener("click", async () => {
        await navigator.clipboard.writeText(selectedPrepText());
        const note = document.getElementById("copyNote");
        if (note) note.textContent = "Copied this passage prep.";
      });

      render();
    </script>
