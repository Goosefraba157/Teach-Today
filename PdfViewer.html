<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Teach Today PDF</title>
    <link rel="icon" href="assets/morrocoy-logo.png">
    <link rel="stylesheet" href="app-nav.css">
    <script src="app-nav.js" defer></script>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --teal: #0f766e;
        --line: #dbe4ee;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: #e2e8f0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .pdf-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .pdf-topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        padding: 9px 14px;
        border-bottom: 1px solid rgba(15, 118, 110, 0.18);
        background: rgba(248, 250, 252, 0.96);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .pdf-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .pdf-brand img {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        object-fit: cover;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
      }

      .pdf-title {
        min-width: 0;
      }

      .pdf-title p {
        margin: 0 0 2px;
        color: var(--teal);
        font-size: 10px;
        font-weight: 950;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .pdf-title h1 {
        margin: 0;
        overflow: hidden;
        color: #0f172a;
        font-size: 18px;
        font-weight: 900;
        line-height: 1.1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pdf-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pdf-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        border: 1px solid #99f6e4;
        border-radius: 999px;
        padding: 7px 12px;
        background: #ecfeff;
        color: var(--teal);
        font-size: 12px;
        font-weight: 900;
        text-decoration: none;
      }

      .pdf-frame-wrap {
        min-height: 0;
        padding: 10px;
      }

      .pdf-frame {
        width: 100%;
        height: calc(100vh - 78px);
        min-height: 520px;
        border: 1px solid rgba(15, 23, 42, 0.16);
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
      }

      .pdf-empty {
        display: grid;
        place-items: center;
        min-height: 60vh;
        padding: 24px;
        text-align: center;
      }

      .pdf-empty div {
        max-width: 420px;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        background: #fff;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.1);
      }

      .pdf-empty h1 {
        margin: 0 0 8px;
      }

      .pdf-empty p {
        margin: 0;
        color: var(--muted);
        font-weight: 800;
      }

      body.stage-view {
        background: #0f172a;
      }

      body.stage-view .pdf-topbar {
        display: none;
      }

      body.stage-view .pdf-frame-wrap {
        height: 100vh;
        padding: 0;
      }

      body.stage-view .pdf-frame {
        height: 100vh;
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      @media (max-width: 620px) {
        .pdf-topbar {
          align-items: flex-start;
        }

        .pdf-actions a {
          min-height: 32px;
          padding: 6px 10px;
          font-size: 11px;
        }

        .pdf-frame-wrap {
          padding: 6px;
        }

        .pdf-frame {
          height: calc(100vh - 72px);
          min-height: 420px;
          border-radius: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="pdf-shell">
      <header class="pdf-topbar">
        <div class="pdf-brand">
          <img src="assets/morrocoy-logo.png" alt="">
          <div class="pdf-title">
            <p>Teach Today PDF</p>
            <h1 id="pdfTitle">Reference PDF</h1>
          </div>
        </div>
        <div class="pdf-actions">
          <a href="ReferencePdfs.html">Reference list</a>
        </div>
      </header>
      <section id="pdfContent" class="pdf-frame-wrap"></section>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      const file = params.get("file") || "";
      const page = params.get("page") || "";
      const title = params.get("title") || "Reference PDF";
      const stageView = params.get("stage") === "1";
      const content = document.getElementById("pdfContent");
      const titleNode = document.getElementById("pdfTitle");

      function isSafePdfPath(value) {
        return value && !/^https?:/i.test(value) && !value.includes("..") && /\.pdf$/i.test(value.split("#")[0]);
      }

      titleNode.textContent = title;
      document.title = `${title} - Teach Today`;
      document.body.classList.toggle("stage-view", stageView);

      if (isSafePdfPath(file)) {
        const src = page ? `${file}#page=${encodeURIComponent(page)}` : file;
        content.innerHTML = `<iframe class="pdf-frame" title="${title.replace(/"/g, "&quot;")}" src="${src}"></iframe>`;
      } else {
        content.className = "pdf-empty";
        content.innerHTML = `
          <div>
            <h1>PDF not found</h1>
            <p>Go back to the reference list and choose the PDF again.</p>
          </div>
        `;
      }
    </script>
  </body>
</html>
